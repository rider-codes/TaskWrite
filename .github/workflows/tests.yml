name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Windows matches the machine the suite is developed on. The suite needs no network, API key or Docker.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
