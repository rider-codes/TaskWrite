<style>

  body.drag .composer { border-color:var(--mark-edge); box-shadow:0 0 0 4px rgba(74,222,128,.3); }

  #settings { position:fixed; top:58px; right:0; bottom:0; width:min(420px,100vw); background:var(--bg); border-left:1px solid var(--line); z-index:40;
              overflow-y:auto; padding:16px 18px; transform:translateX(102%); transition:transform .25s ease; box-shadow:-20px 0 40px -30px rgba(0,0,0,.6); }
  #settings.open { transform:none; }

  @media (max-width:640px) { #thread, .composer-wrap { padding-left:12px; padding-right:12px; } }

  /* Claude Code desktop layout */

  /* polish pass: quieter greys, denser type, flat sections */

  /* dashboard: status colours, sidebar status, home grid */

  .whead h1 { margin:0 0 2px; font:600 22px var(--mono); letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px 4px; list-style:none; margin:0; padding:0; font:500 11px var(--mono); }
  .stepper li { padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .stepper li.done { color:var(--mark); border-color:#24452f; } .stepper li.done::before { content:"✓ "; }
  .stepper li.now { color:#0c1a10; background:var(--mark); border-color:var(--mark); font-weight:600; }
  .bigprog .pbar.big { height:10px; border-radius:5px; margin:0; } .bigprog .pbar.big i { border-radius:5px; transition:width .4s; }
  .bigprog .pfoot { font-size:12px; }
  .plist { display:flex; flex-direction:column; }
  .prow { display:flex; align-items:center; gap:10px; min-height:44px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .plist > :last-child .prow, .plist > .prow:last-child { border-bottom:0; }
  .pic { flex:none; width:22px; height:22px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font:700 11px var(--sans); color:var(--muted); }
  .prow.done .pic { background:var(--mark); border-color:var(--mark); color:#0c1a10; }
  .prow.fail .pic { background:var(--fail); border-color:var(--fail); color:#2a0606; }
  .prow.need .pic { background:var(--need); border-color:var(--need); color:#1a1400; }
  .prow.run .pic { border:2px solid #2d3036; border-top-color:var(--mark); animation:sp .8s linear infinite; }
  .pid { flex:none; font:600 12px var(--mono); color:#b8b8bd; min-width:26px; }
  .ptx { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pst { flex:none; font:500 11px var(--mono); color:var(--muted); } .prow.done .pst { color:var(--mark); } .prow.fail .pst { color:var(--fail); } .prow.need .pst, .prow.run .pst { color:var(--need); }
  .prow.run .pst { color:var(--mark); }
  details.pdet > summary { list-style:none; cursor:pointer; } details.pdet > summary::-webkit-details-marker { display:none; }
  details.pdet[open] > summary .prow { border-bottom-color:transparent; }
  .pchg { flex:none; font:500 11px var(--mono); padding:3px 9px; color:var(--ink-2); border:1px solid var(--line); border-radius:999px; }
  .pchg:hover:not(:disabled) { color:var(--ink); border-color:var(--ink-2); }
  .redobox { padding:8px 0 12px 32px; border-bottom:1px solid var(--line); }
  .mpick { display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:7px 12px; font-size:13px; }
  .mpick .ml { font:500 10px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .subconn { display:flex; align-items:center; gap:8px; padding:6px 0 8px 4px; font-size:12.5px; color:var(--ink-2); border-bottom:1px solid var(--line); }
  .conn { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .conn:last-of-type { border-bottom:0; } .conn.locked { cursor:default; }
  .conn input { position:absolute; opacity:0; pointer-events:none; }
  .conn .cn { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; } .conn .cn b { font:500 14px var(--sans); } .conn small { color:var(--muted); font-size:12.5px; }
  .conn .toggle { flex:none; font:500 12px var(--mono); padding:6px 14px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); }
  .conn.on .toggle { background:var(--mark); border-color:var(--mark); color:#0c1a10; }
  .conn input:focus-visible ~ .toggle { outline:2px solid var(--blue); outline-offset:2px; }

</head>
<body>


<aside id="settings" aria-label="Settings">
  <div class="row"><b>Settings</b><span class="spacer"></span><button class="secondary sm" id="closeSettings">Close</button></div>
  <h2>Model provider</h2>
  <div id="healthMsg" class="muted">Checking…</div>
  <div class="row"><select id="provider" aria-label="Provider"></select><select id="model" class="grow" aria-label="Model"></select></div>
  <div class="row" id="urlRow"><input type="text" id="baseUrl" class="grow" placeholder="Ollama URL"></div>
  <div id="keyRow">
    <div class="row"><input type="password" id="apiKey" class="grow" placeholder="Paste your API key" autocomplete="off" spellcheck="false" aria-label="API key"><button class="secondary sm" id="saveKey">Use key</button></div>
    <div class="muted" id="keyNote"></div>
  </div>
  <div class="row"><button class="sm" id="saveSettings">Save and test connection</button></div>
  <div class="warn" id="settingsWarn"></div>
  <h2>Where code runs</h2>
  <div id="sandboxNote" class="muted">Checking…</div>
  <h2>MCP tools</h2>
  <div id="mcpMsg" class="muted">Checking…</div>
  <div id="mcpServers"></div>
  <div class="row"><button class="secondary sm" id="mcpRefresh">Connect / refresh MCP servers</button></div>
  <div class="bad" id="mcpErr"></div>
</aside>

<div id="shell">
<aside id="side" aria-label="Sessions">
  <div class="side-top"><a class="logo" href="/" aria-label="TaskWrite home" id="logo"></a></div>
  <button class="secondary" id="newChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New session</button>
  <input type="text" id="chatSearch" placeholder="Search sessions" autocomplete="off" aria-label="Search sessions">
  <div id="chatList"></div>
  <div class="side-foot"><button class="ghost" id="openSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button></div>
</aside>
<div id="side-backdrop"></div>
<div id="main">
<div class="topbar">
  <button class="ghost icon" id="toggleSide" aria-label="Show or hide sessions" title="Sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
  <a class="logo" href="/" id="topLogo" aria-label="TaskWrite home"></a>
  <button class="ghost sm hidden" id="backHome" title="Back to all assignments">← All assignments</button>
  <span id="title">Dashboard</span><span class="spacer"></span>
  <span class="dot" id="modelDot" title="Model status"></span>
</div>
<div id="home" class="hidden" aria-label="Dashboard"></div>
<div id="scroller"><div id="thread"></div></div>

<div class="composer-wrap">
  <div class="composer" id="composer">
    <textarea id="msgInput" rows="1" placeholder="Attach an assignment, or type or paste it here" autocomplete="off"></textarea>
    <div class="ctools">
      <button class="ghost icon" id="attach" title="Attach an assignment (PDF, DOCX or TXT)" aria-label="Attach file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg></button>
      <input type="file" id="file" accept=".pdf,.docx,.txt" class="hidden">
      <span class="spacer"></span>
      <button class="ghost chipbtn" id="modelChip" title="Model (open settings)">model</button>
      <button class="icon send" id="send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
  <div class="hint" id="hint"></div>
</div>
</div>
</div>

<script>
const LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#14161b"/><path d="M14 9 H34 L45 20 V49 Q45 52 42 52 H17 Q14 52 14 49 Z" fill="#f6f4ee"/><path d="M34 9 V20 H45 Z" fill="#cfcbbd"/><rect x="19" y="27" width="19" height="3" rx="1.5" fill="#c4c0b2"/><rect x="19" y="34" width="13" height="3" rx="1.5" fill="#c4c0b2"/><circle cx="46" cy="46" r="13" fill="#4ade80" stroke="#14161b" stroke-width="3.5"/><path d="M39.8 46 L44.2 50.4 L52.6 40.8" fill="none" stroke="#14161b" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let sid = null, current = null, pollTimer = null, lastKey = '';
const ui = { open: {}, mode: 'model', consent: false, editPlan: false, mailKey: '', errors: {} };
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); kids.forEach(k => k != null && k !== false && n.append(k)); return n; };
$('logo').innerHTML = LOGO + 'taskwrite';
$('topLogo').innerHTML = LOGO + 'taskwrite';

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, opts);
  const data = res.headers.get('content-type')?.includes('json') ? await res.json() : null;
  if (!res.ok) { const e = new Error(data?.detail ? (typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail)) : res.statusText);
    e.options = data?.options || []; e.status = res.status; throw e; }
  return data;
}
const post = (p, body) => api(p, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body ?? {}) });
const put = (p, body) => api(p, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });

/* ---------- settings drawer ---------- */
$('openSettings').onclick = () => $('settings').classList.toggle('open');
$('modelChip').onclick = () => $('settings').classList.add('open');
$('side-backdrop').onclick = () => document.body.classList.add('side-closed');
$('closeSettings').onclick = () => $('settings').classList.remove('open');
let H = null;
const PROVIDER_NAMES = { ollama:'Ollama (local)', gemini:'Google Gemini', groq:'Groq', openai:'OpenAI', anthropic:'Anthropic' };
async function loadHealth() {
  const h = H = await api('/health');
  const prov = h.config.llm_provider, cloud = prov !== 'ollama';
  $('healthMsg').textContent = h.message; $('healthMsg').className = h.ok ? 'ok' : 'bad';
  $('modelDot').className = 'dot ' + (h.ok ? 'ok' : 'bad'); $('modelDot').title = h.message;
  $('modelChip').textContent = h.active_model ? `${prov}: ${h.active_model}` : `${prov}: choose a model`;
  $('provider').replaceChildren(...h.supported_providers.map(p => el('option', {value:p, textContent:PROVIDER_NAMES[p] || p, selected:p === prov})));
  $('baseUrl').value = h.config.ollama_base_url;
  $('urlRow').classList.toggle('hidden', cloud); $('keyRow').classList.toggle('hidden', !cloud);
  $('keyNote').textContent = cloud ? (h.keys[prov] ? 'A key is set for this session. It is kept in memory only: never saved to disk or shown again.'
    : 'No key yet. Paste one here (memory only), or put it in the .env file and restart.') : '';
  const models = [...new Set([...h.models, h.active_model].filter(Boolean))];
  $('model').replaceChildren(el('option', {value:'', textContent:'(choose a model)'}),
    ...models.map(m => el('option', {value:m, textContent:m, selected:m === h.active_model})));
  if (current) renderThread(current, true);
}
const modelField = p => ({ ollama:'ollama_model', gemini:'gemini_model', groq:'groq_model', openai:'openai_model', anthropic:'anthropic_model' })[p];
$('provider').onchange = async () => {   // switching only changes which provider is selected; nothing is sent anywhere
  try { await put('/settings', {llm_provider:$('provider').value}); $('settingsWarn').textContent = ''; await loadHealth(); }
  catch (e) { $('settingsWarn').textContent = e.message; }
};
$('saveKey').onclick = async () => {
  const key = $('apiKey').value; $('apiKey').value = '';
  try { await put('/keys', {provider:$('provider').value, key}); $('settingsWarn').textContent = ''; await loadHealth(); }
  catch (e) { $('settingsWarn').textContent = e.message; }
};
$('saveSettings').onclick = async () => {
  try {
    const prov = $('provider').value, body = {llm_provider:prov, [modelField(prov)]:$('model').value};
    if (prov === 'ollama') body.ollama_base_url = $('baseUrl').value;
    const r = await put('/settings', body);
    $('settingsWarn').textContent = r.warning || ''; await loadHealth();
  } catch (e) { $('settingsWarn').textContent = e.message; }
};
async function loadSandbox() {
  try { const s = await api('/sandbox'); $('sandboxNote').textContent = s.note; SANDBOX = s; } catch (e) { $('sandboxNote').textContent = 'Could not check.'; }
}
let SANDBOX = null;
let MCPSTATE = null;
function renderMcp(m) {
  MCPSTATE = m;
  const n = m.servers.reduce((a, x) => a + x.tools.length, 0);
  $('mcpMsg').textContent = m.servers.length ? `${m.servers.length} server(s) in ${m.config_path}; ${n} tool(s) found.`
    : `No MCP servers configured. Add them to ${m.config_path} (see mcp_servers.example.json), then connect.`;
  $('mcpServers').replaceChildren(...m.servers.map(x => el('div', {className:'tool'},
    el('b', {textContent:x.name}), ' ', el('span', {className:'pill', textContent:x.status}),
    el('div', {className:'muted', textContent:x.command}),
    el('div', {className:x.error ? 'bad' : 'muted', textContent: x.error || (x.tools.length ? x.tools.map(t => t.name).join(', ') : 'Not connected yet.')}),
    x.hidden && x.hidden.length ? el('div', {className:'warn', textContent:`Blocked by TaskWrite, never used: ${x.hidden.join(', ')}`}) : null)),
    ...m.problems.map(p => el('div', {className:'warn', textContent:p})));
}
let mcpWait = null, mcpWasConnecting = false;
async function loadMcp() {
  try {
    const m = await api('/mcp'); renderMcp(m); clearTimeout(mcpWait);
    const finished = mcpWasConnecting && !m.connecting, started = !mcpWasConnecting && m.connecting;
    mcpWasConnecting = m.connecting;
    if (m.connecting) { $('mcpMsg').textContent = 'Connecting to your connectors…'; mcpWait = setTimeout(loadMcp, 2000); }   // the app connects them itself at start-up
    if (finished && sid && current?.status !== 'running') await openSession(sid);   // offer the newly connected tools
    else if (started && current) renderThread(current, true);   // only on a change, so typing is never wiped by the 2 s check
  } catch (e) { $('mcpMsg').textContent = 'Could not read MCP status.'; }
}
$('mcpRefresh').onclick = async () => {
  $('mcpErr').textContent = ''; $('mcpMsg').textContent = 'Connecting to your MCP servers (the first run of a server may take a minute)...';
  $('mcpRefresh').disabled = true;
  try { renderMcp(await post('/mcp/refresh')); if (sid) await openSession(sid); } catch (e) { $('mcpErr').textContent = e.message; }
  $('mcpRefresh').disabled = false;
};

/* ---------- sessions ---------- */
let allSessions = [];
function dayGroup(iso) {
  const d = new Date(iso || Date.now()), t = new Date(), y = new Date(Date.now() - 864e5);
  const same = (a, b) => a.toDateString() === b.toDateString();
  return same(d, t) ? 'Today' : same(d, y) ? 'Yesterday' : 'Earlier';
}
const pendingDelete = {};
function chatRow(x) {
  const open = el('button', {className:'chat-item' + (x.id === sid ? ' on' : ''), onclick:() => { openSession(x.id); if (innerWidth <= 760) document.body.classList.add('side-closed'); }},
    el('span', {className:'t', textContent:x.filename}), el('span', {className:'d ' + kindOf(x.status).cls, textContent:kindOf(x.status).label}));
  const asking = !!pendingDelete[x.id];
  const del = el('button', {className:'chat-del' + (asking ? ' ask' : ''), textContent:asking ? 'Delete?' : '✕', title:asking ? 'Click again to delete this chat for good' : 'Delete this chat',
    ariaLabel:'Delete chat ' + x.filename, onclick:async e => {
      e.stopPropagation();
      if (!pendingDelete[x.id]) { pendingDelete[x.id] = setTimeout(() => { delete pendingDelete[x.id]; drawSessions(); }, 3500); drawSessions(); return; }
      clearTimeout(pendingDelete[x.id]); delete pendingDelete[x.id];
      try { await api('/sessions/' + x.id, {method:'DELETE'}); if (x.id === sid) goHome(false); await loadSessions(); }
      catch (err) { say(err.message); drawSessions(); }
    }});
  return el('div', {className:'chat-row'}, open, del);
}
function drawSessions() {
  const q = $('chatSearch').value.trim().toLowerCase();
  const list = allSessions.filter(x => !q || x.filename.toLowerCase().includes(q));
  const nodes = []; let last = '';
  list.forEach(x => {
    const g = dayGroup(x.updated_at || x.created_at);
    if (g !== last) { nodes.push(el('div', {className:'grp', textContent:g})); last = g; }
    nodes.push(chatRow(x));
  });
  $('chatList').replaceChildren(...(nodes.length ? nodes : [el('div', {className:'side-empty', textContent: q ? 'No matches.' : 'No sessions yet. Attach an assignment to start one.'})]));
  if (!sid) drawHome();
}

/* ---------- dashboard home ---------- */
/* Display only. The status comes from the backend; this never decides what is allowed. */
const KINDS = {
  need: { cls:'k-need', pill:'NEEDS YOU', label:'needs your approval', fill:true },
  run:  { cls:'k-run',  pill:'RUNNING',   label:'running', fill:false },
  fail: { cls:'k-fail', pill:'FAILED',    label:'failed', fill:true },
  done: { cls:'k-done', pill:'DONE',      label:'done', fill:true },
};
const KIND_OF = { awaiting_review:'need', plan_ready:'need', plan_approved:'need', awaiting_input:'need', awaiting_confirmation:'need', paused_budget:'need', interrupted:'need',
  running:'run', failed:'fail', cancelled:'fail', completed:'done' };
const NEED_LABEL = { awaiting_review:'review the checklist', plan_ready:'approve the plan', plan_approved:'ready to run', awaiting_input:'needs your answer',
  awaiting_confirmation:'needs your approval', paused_budget:'paused: out of steps', interrupted:'interrupted: resume' };
function kindOf(status) {
  const k = KIND_OF[status] || 'need', base = KINDS[k];
  const label = k === 'need' ? (NEED_LABEL[status] || base.label) : status === 'cancelled' ? 'stopped' : base.label;
  return { key:k, cls:base.cls, label, pill:status === 'cancelled' ? 'STOPPED' : base.pill, fill:base.fill };
}
/* Where the assignment is among the six steps, estimated from its status and step budget. */
const STEP_NAMES = ['Upload', 'Checklist', 'Connectors', 'Plan', 'Run', 'Result'];
function stepOf(x) {
  const idx = { awaiting_review:2, plan_ready:4, plan_approved:5, running:5, awaiting_input:5, awaiting_confirmation:5, paused_budget:5, interrupted:5, failed:5, cancelled:5, completed:6 }[x.status] || 2;
  let pct = (idx - 1) / 6 * 100;
  if (idx === 5 && x.step_cap) pct += Math.min(x.steps_used / x.step_cap, 1) * (100 / 6) * 0.95;
  if (x.status === 'completed') pct = 100;
  const text = x.status === 'completed' ? 'Finished' : (['failed', 'cancelled'].includes(x.status) ? 'Stopped in ' : `Step ${idx} of 6 · `) + STEP_NAMES[idx - 1];
  return { pct:Math.round(pct), text };
}
ui.filter = null;
function whenText(iso) {
  const d = new Date(iso || Date.now()), g = dayGroup(iso);
  const t = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  return g === 'Today' ? 'Updated ' + t : g === 'Yesterday' ? 'Yesterday ' + t : 'Updated ' + d.toLocaleDateString([], {day:'numeric', month:'short'});
}
function assignmentCard(x) {
  const k = kindOf(x.status), st = stepOf(x);
  return el('button', {className:'acard st-' + k.key + (k.key === 'need' ? ' need' : ''), onclick:() => openSession(x.id), ariaLabel:`${x.filename}, ${k.label}`},
    el('div', {className:'top'},
      el('div', {style:'min-width:0'}, el('div', {className:'nm', textContent:x.filename}),
        el('div', {className:'meta', textContent:whenText(x.updated_at) + (x.step_cap ? ` · ${x.steps_used}/${x.step_cap} steps` : '')})),
      el('span', {className:`spill ${k.cls}` + (k.fill ? ' fill' : ''), textContent:k.pill})),
    el('div', {className:k.cls}, el('div', {className:'pbar'}, el('i', {style:`width:${st.pct}%`})),
      el('div', {className:'pfoot'}, el('span', {textContent:st.text}), el('span', {textContent:st.pct + '%'}))));
}
function drawHome() {
  const box = $('home'); if (sid) return;
  const q = $('chatSearch').value.trim().toLowerCase();
  const n = { need:0, run:0, fail:0, done:0 };
  allSessions.forEach(x => n[kindOf(x.status).key]++);
  const shown = allSessions.filter(x => (!q || x.filename.toLowerCase().includes(q)) && (!ui.filter || kindOf(x.status).key === ui.filter));
  const chips = [['need', 'needs you'], ['run', 'running'], ['fail', 'failed'], ['done', 'done']].map(([k, label]) =>
    el('button', {className:'count secondary ' + KINDS[k].cls + (ui.filter === k ? ' on' : ''), ariaPressed:String(ui.filter === k), title:'Show only ' + label,
      onclick:() => { ui.filter = ui.filter === k ? null : k; drawHome(); }},
      el('i', {className:'sw'}), el('b', {textContent:n[k], style:'color:var(--ink)'}), el('span', {className:'l', textContent:label})));
  const empty = !allSessions.length ? 'No assignments yet. Press New session to attach or paste your first one.'
    : !shown.length ? 'Nothing matches that filter.' : '';
  if (!$('homeGrid')) {   // build the page once, so the composer keeps focus and typed text while the cards refresh
    box.replaceChildren(el('div', {className:'wrap'},
      el('div', {className:'home-head'}, el('div', {}, el('div', {className:'eyebrow', textContent:'Dashboard'}), el('h1', {}, 'Your ', el('span', {className:'hl', textContent:'assignments'}))),
        el('div', {className:'counts', id:'homeCounts'})),
      el('div', {id:'composerSlot'}),
      el('div', {id:'homeErr'}), el('div', {id:'homeEmpty', className:'muted'}), el('div', {className:'grid', id:'homeGrid'})));
  }
  // the attach/paste box only appears while starting a new session; the dashboard itself has no chat box
  if (ui.starting) { if (CW.parentNode !== $('composerSlot')) $('composerSlot').append(CW); }
  else if (CW.parentNode === $('composerSlot')) $('main').append(CW);
  $('composerSlot').classList.toggle('hidden', !ui.starting);
  $('homeCounts').replaceChildren(...chips);
  $('homeErr').replaceChildren(...[errLine('upload')].filter(Boolean));
  $('homeEmpty').textContent = empty;
  $('homeGrid').replaceChildren(...shown.map(assignmentCard),
    el('button', {className:'acard newcard secondary', onclick:() => goHome(true)}, '+ New assignment'));
}
const CW = document.querySelector('.composer-wrap');
function goHome(starting = false) {
  sid = null; current = null; clearInterval(pollTimer); lastKey = ''; ui.errors = {}; ui.starting = starting;
  renderThread(null); loadSessions(); if (starting) $('msgInput').focus();
}

function connectorsCard(s, editable) {

    else blocks.push(el('div', {className:'conn locked'}, el('span', {className:'cn'}, el('b', {textContent:d.name}), el('small', {textContent:d.setup && MCPSTATE?.connecting ? 'Connecting…' : d.none})),
      d.setup && editable && !MCPSTATE?.connecting ? btn('Set up', () => $('settings').classList.add('open'), 'secondary sm') : el('span', {className:'toggle', textContent:'Off'})));
  });
  const local = LOCAL_TOOLS.map(([n, name, note]) => [n, name, note, s.tool_requests.find(t => t.name === n)]).filter(x => x[3])

    ...blocks, ...section('On this computer', local));

    el('div', {className:'row'}, btn('Save', () => act(save, 'plan'), 'secondary sm'),

function problemRows(s) {
  const reqs = s.requirements.filter(r => r.kind !== 'constraint');
  return (reqs.length ? reqs : s.requirements).map(r => {
    const steps = (s.plan?.steps || []).filter(st => (st.requirement_ids || []).includes(r.id));
    let state = 'wait';
    if (steps.length && steps.every(st => st.status === 'completed')) state = 'done';
    else if (steps.some(st => ['failed', 'incomplete'].includes(st.status))) state = 'fail';
    else if (steps.some(st => st.status === 'running')) state = 'run';
    else if (steps.some(st => ['needs_input', 'needs_confirmation'].includes(st.status))) state = 'need';
    else if (!steps.length && s.status === 'completed') state = 'done';
    const code = (s.code_results || []).find(c => c.requirement_id === r.id);
    if (state === 'done' && code && ['failed', 'no_code'].includes(code.status)) state = 'fail';   // the step finished but its code did not run cleanly
    return {r, state, code};
  });
}
const STATE_LABEL = {done:'Done', run:'Working…', fail:'Failed', need:'Needs you', wait:'Waiting'};
function problemRow(x, s) {
  const [label, tone] = x.code ? (CODE_BADGE[x.code.status] || ['', '']) : ['', ''];

  const change = canChange ? el('button', {className:'ghost sm pchg', textContent:'Change this', title:'Redo only this problem with your instruction',
    onclick:e => { e.preventDefault(); e.stopPropagation(); ui.redo = ui.redo === x.r.id ? null : x.r.id; renderThread(current, true); }}) : null;
  const head = el('div', {className:'prow ' + x.state},
    el('span', {className:'pic', textContent:{done:'✓', fail:'✕', need:'!'}[x.state] || ''}), el('span', {className:'pid', textContent:x.r.id.toUpperCase()}),
    el('span', {className:'ptx', textContent:x.r.text}), x.code && label ? el('span', {className:'pill ' + tone, textContent:label}) : null,
    change, el('span', {className:'pst', textContent:STATE_LABEL[x.state]}));
  const row = x.code ? el('details', {className:'pdet'}, el('summary', {}, head), codeCard(x.code)) : head;
  return ui.redo === x.r.id && canChange ? el('div', {}, row, redoBox(x.r)) : row;

function stepper(s) {

let lastWorkSid = null;
function renderWork(s) {

    if (s.deliverable) nodes.push(deliverableCard(s));

      nodes.push(el('div', {className:'card'}, el('h3', {textContent:'Limits and things to check'}), el('ul', {}, ...s.limitations.map(l => el('li', {textContent:l})))));

const CODE_BADGE = { tests_passed:['tests passed', 'ok'], ran_ok:['ran without errors', 'ok'], failed:['failed', 'bad'], not_run:['not run', 'warn'], no_code:['no code', 'bad'] };
const CODE_MEANING = { tests_passed:'The tests the model wrote for itself passed. That shows the code runs and matches those tests. It does not prove the solution is correct.',
  ran_ok:'The code ran without errors. There were no tests, so nothing else was checked.', failed:'The code failed when run. Read the error below before using it.',
  not_run:'The code was not run.', no_code:'No usable code was produced for this question.' };
function codeCard(c) {
  const [label, tone] = CODE_BADGE[c.status] || [c.status, ''];
  const where = c.sandbox_level ? `run isolation: ${c.sandbox_level}` : '';
  const body = [el('p', {className:'muted', textContent:`${CODE_MEANING[c.status] || ''}${c.attempts > 1 ? ` It took ${c.attempts} attempts.` : ''}${where ? ' ' + where + '.' : ''}`}),
    el('h3', {textContent:'Why I wrote it this way'}), el('p', {textContent:c.explanation || 'No explanation was returned.'})];
  if (c.code) body.push(el('h3', {textContent:'Code'}), el('pre', {textContent:c.code}));
  if (c.tests) body.push(el('details', {}, el('summary', {textContent:'Tests the model wrote'}), el('pre', {textContent:c.tests})));
  for (const [t, v] of [['Output', c.stdout], ['Error', c.stderr], ['Note', c.note]]) if (v && v.trim()) body.push(el('h3', {textContent:t}), el('pre', {textContent:v.trim()}));
  return el('details', {className:'card', open:true}, el('summary', {}, c.filename + '  ', el('span', {className:'pill ' + tone, textContent:label})), ...body);
}

function workspaceCard(s, editable) {
  const input = el('input', {type:'text', value:s.workspace_dir, className:'grow', disabled:!editable, spellcheck:false, ariaLabel:'Workspace folder'});
  const save = path => act(() => put(`/sessions/${sid}/workspace`, {path}), 'workspace');
  const c = el('div', {className:'card'}, el('h3', {textContent:'Workspace folder'}), el('div', {className:'row'}, input));
  if (editable) c.append(el('div', {className:'row'},
    btn('Browse…', async () => { try { const r = await api('/workspace/browse'); if (r.path) { input.value = r.path; await save(r.path); } } catch (e) { ui.errors.workspace = e.message; renderThread(current, true); } }, 'secondary sm'),
    btn('Use this folder', () => save(input.value), 'sm')));
  c.append(el('div', {className:'muted', textContent:'Files go in a sub-folder named after the assessment. Nothing is written until the run finishes and you approved the VS Code tool.'}));
  if (ui.errors.workspace) c.append(errLine('workspace'));
  return c;
}

function checklistCard(s, editable) {
  const rows = s.requirements.map((r, i) => {
    const kind = el('select', {disabled:!editable}, ...['question','deliverable','constraint'].map(k => el('option', {value:k, textContent:k, selected:k===r.kind})));
    const text = el('input', {type:'text', value:r.text, className:'grow', disabled:!editable});
    const del = el('button', {className:'secondary sm', textContent:'✕', disabled:!editable, title:'Remove', onclick:() => { harvest(s); s.requirements.splice(i, 1); renderThread(s, true); }});
    const row = el('div', {className:'row'}, el('span', {className:'pill', textContent:r.id}), kind, text, del);
    row._get = () => ({id:r.id, text:text.value, kind:kind.value, source_text:r.source_text});
    return row;
  });
  const wrap = el('details', {className:'card', id:'checklistCard', open: editable || !!ui.open.check, ontoggle:e => { ui.open.check = e.target.open; }}, el('summary', {textContent:'Requirements checklist · ' + rows.length}), ...rows);
  if (editable) wrap.append(el('div', {className:'row'},
    btn('Add item', () => { harvest(s); s.requirements.push({id:'q' + (s.requirements.length + 1) + 'x', text:'New item', kind:'question', source_text:''}); renderThread(s, true); }, 'secondary sm'),
    btn('Save checklist', () => act(() => put(`/sessions/${sid}/checklist`, [...document.querySelectorAll('#checklistCard .row')].filter(r => r._get).map(r => r._get())), 'plan'), 'sm'),
    btn('Refine with model', () => act(() => post(`/sessions/${sid}/checklist/refine`), 'plan'), 'secondary sm')));
  wrap.append(el('details', {}, el('summary', {textContent:'Extracted text preview'}), el('pre', {textContent:s.text_preview})));
  return wrap;
}
function harvest(s) { const rows = [...document.querySelectorAll('#checklistCard .row')].filter(r => r._get); if (rows.length === s.requirements.length) s.requirements = rows.map(r => r._get()); }

function planCard(s) {
  const rows = s.plan.steps.map(st => el('tr', {}, el('td', {textContent:st.id}), el('td', {textContent:st.kind}), el('td', {textContent:st.objective}),
    el('td', {textContent:st.tools.join(', ') || '—'}), el('td', {textContent:st.status + (st.notes ? ' — ' + st.notes : '')})));
  const c = el('div', {className:'card' + (s.status === 'plan_ready' ? ' hot' : '')}, el('h3', {textContent:'Plan'}),
    el('div', {style:'overflow-x:auto'}, el('table', {}, el('tr', {}, ...['Step','Action','Objective','Tools','Status'].map(h => el('th', {textContent:h}))), ...rows)));
  if (s.status === 'plan_ready') {
    const ta = el('textarea', {id:'planJson', className: ui.editPlan ? '' : 'hidden',
      value:JSON.stringify({steps: s.plan.steps.map(({output, notes, status, attempts, repair_attempts, retryable, tool_calls, ...keep}) => keep)}, null, 2)});
    c.append(ta, el('div', {className:'row'},
      btn('Approve plan', () => act(() => post(`/sessions/${sid}/plan/approve`), 'planapprove'), 'sm'),
      btn(ui.editPlan ? 'Hide JSON' : 'Edit as JSON', () => { ui.editPlan = !ui.editPlan; renderThread(s, true); }, 'secondary sm'),
      ui.editPlan ? btn('Save edited plan', () => act(async () => put(`/sessions/${sid}/plan`, JSON.parse($('planJson').value)), 'planapprove'), 'secondary sm') : null));
  }
  return c;
}

let runStartedAt = 0, ticker = null;
function runCard(s, canRun, running) {
  const mode = el('select', {onchange:e => { ui.mode = e.target.value; }}, el('option', {value:'model', textContent:'Use the selected model', selected:ui.mode === 'model'}),
    el('option', {value:'rule_based', textContent:'Limited rule-based fallback (arithmetic only, no model)', selected:ui.mode === 'rule_based'}));
  const consent = el('input', {type:'checkbox', checked:ui.consent, onchange:e => { ui.consent = e.target.checked; }});
  const cloud = H && H.config.llm_provider !== 'ollama', pname = H ? (PROVIDER_NAMES[H.config.llm_provider] || H.config.llm_provider) : '';
  const c = el('div', {className:'card'}, el('div', {className:'row'}, mode, cloud ? el('label', {className:'row', style:'margin:0'}, consent, `I allow sending the relevant assignment text to ${pname}`) : null),
    SANDBOX ? el('div', {className:'muted', textContent:'Code runs: ' + SANDBOX.note}) : null,
    el('div', {className:'row'}, btn(s.steps_used ? 'Run again' : 'Run', () => runIt('run'), 'sm'), btn(s.cancel_requested && running ? 'Stopping…' : 'Cancel', () => act(() => post(`/sessions/${sid}/cancel`), 'run'), 'secondary sm')));
  c.querySelectorAll('button')[0].disabled = !canRun; c.querySelectorAll('button')[1].disabled = !running || !!s.cancel_requested;
  if (s.status === 'paused_budget') {
    const extra = el('input', {type:'text', value:'8', size:3});
    c.append(el('div', {className:'row'}, 'Add', extra, 'steps', btn('Continue', () => act(() => post(`/sessions/${sid}/continue`, {extra_steps:parseInt(extra.value || '8', 10), ...runBody()}), 'run'), 'sm')));
  }
  return c;
}

function searchCard(c) {
  const decide = approve => async () => {
    try { try { await post(`/sessions/${sid}/confirm`, {approve}); } catch (e) { if (e.status !== 409) throw e; }  // already decided: just carry on
      await runIt('confirm'); } catch (e) { ui.errors.confirm = e.message; renderThread(current, true); } };
  const info = [['Where it goes', 'DuckDuckGo (html.duckduckgo.com), over the internet'],
    ['What is sent', 'Only the search queries below. Not your assignment text, and no personal details.'],
    ['What comes back', 'Titles, links and short snippets. TaskWrite does not open the pages, so it cannot say it read them.'],
    ['Why', c.why || 'To find sources to cite']];
  return el('div', {className:'card hot'}, el('h3', {className:'warn', textContent:'Approval needed: web search'}),
    p('Nothing is sent until you approve. This is exactly what will leave your computer:'),
    el('pre', {textContent:(c.arguments.queries || []).map(q => '• ' + q).join('\n')}),
    el('table', {}, ...info.map(([k, v]) => el('tr', {}, el('th', {textContent:k}), el('td', {textContent:v})))),
    el('div', {className:'row'}, btn('Send these searches', decide(true), 'sm'), btn('Decline', decide(false), 'secondary sm')));
}

function publishCard(s) {
  const items = s.publish_items, check = items.find(i => i.role === 'check'), files = items.filter(i => i.role === 'file'), mail = items.find(i => i.role === 'mail'), doc = items.find(i => i.role === 'doc');
  const boxes = {};
  const row = (i, title) => {
    const cb = el('input', {type:'checkbox', checked:i.checked}); boxes[i.id] = cb;
    return el('div', {className:'tool'}, el('label', {}, cb, ' ', el('b', {textContent:title}), ' ', el('span', {className:'pill', textContent:`${i.size} bytes`})),
      el('details', {}, el('summary', {textContent:'Preview'}), el('pre', {textContent:i.preview + (i.size > i.preview.length ? '\n…' : '')})));
  };
  const rows = files.map(i => row(i, i.path));
  const decide = approve => async () => {
    try { await post(`/sessions/${sid}/publish`, {approve, item_ids: approve ? items.filter(i => boxes[i.id]?.checked).map(i => i.id).concat(check ? [check.id] : []) : []});
      await runIt('publish'); } catch (e) { ui.errors.publish = e.message; renderThread(current, true); } };
  const facts = [];
  if (files.length) facts.push(['VS Code', `${items.find(i => i.role === 'file').server} server on this computer. Creates exactly these files in ${s.workspace_dir}, one call each. Existing files are never overwritten, nothing lands outside the folder, and each file is read back from disk.`]);
  if (mail) facts.push(['Gmail', `${mail.server} server. Saves one draft in your Gmail account, with no recipient. It cannot send, and TaskWrite cannot read your mail. It starts unticked: tick it only if you want it.`]);
  if (doc) facts.push(['Google Docs', `${doc.server} server. Creates one new document in your Google account, as plain text. It never shares it, and TaskWrite cannot read or change your other documents. It starts unticked.`]);
  return el('div', {className:'card hot'}, el('h3', {className:'warn', textContent:'Needs your approval: ' + [files.length ? 'create files' : '', mail ? 'save a Gmail draft' : '', doc ? 'save a Google Doc' : ''].filter(Boolean).join(' and ')}),
    p('Nothing is created until you approve. Untick anything you do not want.'),
    el('table', {}, ...facts.map(([k, v]) => el('tr', {}, el('th', {textContent:k}), el('td', {textContent:v})))),
    ...rows, mail ? row(mail, mail.label) : null, doc ? row(doc, doc.label) : null,
    el('div', {className:'row'}, btn('Approve what is ticked', decide(true), 'sm'), btn('Skip all', decide(false), 'secondary sm')));
}

const PUBLISH_BADGE = { created:['created', 'ok'], ok:['ok', 'ok'], declined:['not created', ''], refused:['refused', 'bad'], exists:['already there', 'warn'],
  not_found:['not found', 'bad'], mismatch:['content differs', 'bad'], failed:['failed', 'bad'], skipped:['skipped', 'warn'] };
function publishResultsCard(s) {
  const rows = s.publish_results.map(r => {
    const [label, tone] = PUBLISH_BADGE[r.status] || [r.status, ''];
    return el('div', {className:'tool'}, el('b', {textContent:r.path || ({mail:'Gmail draft', doc:'Google Doc'}[r.role] || 'Folder check')}), ' ', el('span', {className:'pill ' + tone, textContent:label}),
      r.read_back ? el('span', {className:'pill ok', textContent:'read back'}) : null, el('div', {className:'why', textContent:r.detail}));
  });
  return el('details', {className:'card', open:true}, el('summary', {textContent:'Created through your connectors'}), ...rows);
}

function pagesCard(c) {
  const decide = approve => async () => {
    try { try { await post(`/sessions/${sid}/confirm`, {approve}); } catch (e) { if (e.status !== 409) throw e; }
      await runIt('confirm'); } catch (e) { ui.errors.confirm = e.message; renderThread(current, true); } };
  const info = [['Where it goes', 'Each website below, directly from your computer. The sites can see your IP address and that a visit happened.'],
    ['What is sent', 'A normal page request for each address. Not your assignment text.'],
    ['What comes back', 'The page text. Only the first part (about 3,000 characters) is kept and used; scripts and menus are dropped.'],
    ['Safety', 'Only addresses that the search itself returned, only public websites, never anything on your own computer or network.']];
  return el('div', {className:'card hot'}, el('h3', {className:'warn', textContent:'Approval needed: open web pages'}),
    p('Nothing is opened until you approve. These are the exact addresses:'),
    el('pre', {textContent:(c.arguments.urls || []).map(u => '• ' + u).join('\n')}),
    el('table', {}, ...info.map(([k, v]) => el('tr', {}, el('th', {textContent:k}), el('td', {textContent:v})))),
    el('div', {className:'row'}, btn('Open these pages', decide(true), 'sm'), btn('Decline', decide(false), 'secondary sm')));
}

function sourcesCard(s) {
  const list = el('ol', {style:'margin:6px 0 0 18px;padding:0'}, ...s.sources.map(x => el('li', {style:'margin:6px 0'},
    el('a', {href:x.url, target:'_blank', rel:'noopener noreferrer', textContent:x.title, style:'text-decoration:underline'}),
    el('div', {className:'muted', textContent:`[${x.id}] ${x.opened ? 'page opened · ' : 'snippet only · '}${x.snippet}`}))));
  return el('details', {className:'card', open:true}, el('summary', {textContent:`Sources found · ${s.sources.length}`}),
    el('p', {className:'muted', textContent:`Searched: ${s.searches.map(q => '“' + q + '”').join(', ')}. ${s.sources.some(x => x.excerpt) ? s.sources.filter(x => x.excerpt).length + ' page(s) were opened and only their first part was read; the rest are snippets.' : 'Only titles and snippets were read; the pages were not opened.'}`}), list);
}

function confirmCard(c) {
  if (c.tool === 'web_search') return searchCard(c);
  if (c.tool === 'read_pages') return pagesCard(c);
  const info = [['Where it runs', `MCP server "${c.server}" (a program on your computer)`], ['Tool', c.tool], ['Why', c.why || 'No reason given'],
    ['Could it change things?', c.read_only === false ? 'Yes, the server says it is not read-only' : 'Unknown, so it asks first']];
  const decide = approve => async () => {
    try { try { await post(`/sessions/${sid}/confirm`, {approve}); } catch (e) { if (e.status !== 409) throw e; }  // already decided: just carry on
      await runIt('confirm'); } catch (e) { ui.errors.confirm = e.message; renderThread(current, true); } };
  return el('div', {className:'card hot'}, el('h3', {className:'warn', textContent:'Approval needed: tool call'}),
    p('The agent wants to run this MCP tool. It runs on your computer and may change things. Nothing happens unless you approve. Check the arguments, because that is exactly what will be sent.'),
    el('table', {}, ...info.map(([k, v]) => el('tr', {}, el('th', {textContent:k}), el('td', {textContent:v})))),
    el('pre', {textContent:JSON.stringify(c.arguments, null, 2)}),
    el('div', {className:'row'}, btn('Approve and run', decide(true), 'sm'), btn('Decline', decide(false), 'secondary sm')));
}

function emailCard(s) {
  const d = s.email_draft;
  const to = el('input', {type:'text', value:d.to, className:'grow'}), subj = el('input', {type:'text', value:d.subject, className:'grow'});
  const body = el('textarea', {value:d.body}), ok = el('input', {type:'checkbox'});
  return el('div', {className:'card hot'}, el('h3', {textContent:'Email draft: your approval'}),
    el('p', {className:'warn', textContent:'This only opens a draft in your mail app. TaskWrite cannot send it and cannot confirm it was sent: you press Send yourself. The text below will be placed in the draft.'}),
    el('div', {className:'row'}, 'To', to), el('div', {className:'row'}, 'Subject', subj), body,
    el('div', {className:'muted', textContent:(d.attachment ? 'Attach this file yourself (mail links cannot attach files): ' + d.attachment : 'No attachment.') + (d.status === 'opened' ? '  A draft was opened already.' : '')}),
    el('div', {className:'row'}, el('label', {className:'row', style:'margin:0'}, ok, 'I reviewed the recipient and content'),
      btn('Open draft in my mail app', () => act(() => post(`/sessions/${sid}/email/open`, {to:to.value, subject:subj.value, body:body.value, confirm:ok.checked}), 'mail'), 'sm')));
}

function deliverableCard(s) {
  const v = s.validation;
  const c = el('div', {className:'card'}, el('h3', {textContent:'Deliverable'}), el('pre', {textContent:s.deliverable}));
  if (v) c.append(el('h3', {textContent:'Validation report'}), el('div', {textContent:v.summary}),
    el('table', {}, ...v.results.map(r => el('tr', {}, el('td', {textContent:r.requirement_id.toUpperCase()}),
      el('td', {className:{met:'ok', addressed:'ok', not_met:'bad', unverified:'warn'}[r.status], textContent:r.status}), el('td', {textContent:r.detail})))));
  c.append(el('div', {className:'row'}, ...[['md','Download .md'],['docx','Download .docx'],['txt','Download .txt']].map(([f, l]) =>
    btn(l, () => { location.href = `/api/sessions/${sid}/export?format=${f}`; }, 'secondary sm'))));
  return c;
}

async function refreshLog() {
  if (!sid || !$('log')) return;
  try { const log = await api(`/sessions/${sid}/log`); if ($('log')) $('log').textContent = log.map(e => `${e.ts}  ${e.kind}  ${e.step_id || ''}  ${e.summary}  [${e.result}]`).join('\n'); } catch (e) { /* ignore */ }
}
function poll() {
  clearInterval(pollTimer);
  if (current?.status !== 'running') return;
  pollTimer = setInterval(async () => {
    try { const s = await api('/sessions/' + sid); show(s); if (s.status !== 'running') { clearInterval(pollTimer); loadSessions(); } } catch (e) { /* retry next tick */ }
  }, 1500);
}

renderThread(null);
/* deep link: /app#sid=<id>&focus=code|sources|approval|plan|settings  (used for screenshots and bookmarks) */
(async function deepLink() {
  const m = location.hash.match(/sid=([a-f0-9]+)/), focus = (location.hash.match(/focus=(\w+)/) || [])[1];
  if (m) { try { await openSession(m[1]); } catch (e) { return; } }
  if (focus === 'settings') { $('settings').classList.add('open'); return; }
  const pick = {code: () => [...document.querySelectorAll('details.card')].find(d => /\.py/.test(d.querySelector('summary')?.textContent || '')),
    sources: () => [...document.querySelectorAll('details.card')].find(d => /^Sources found/.test(d.querySelector('summary')?.textContent || '')),
    approval: () => document.querySelector('.card.hot'), plan: () => [...document.querySelectorAll('.card')].find(d => /^Plan/i.test(d.querySelector('h3')?.textContent || ''))}[focus];
  setTimeout(() => { const t = pick && pick(); if (t) { $('scroller').style.scrollBehavior = 'auto'; t.scrollIntoView({block:'start'}); } }, 700);
})();
loadMcp();
loadSandbox();
loadHealth().catch(() => { $('healthMsg').textContent = 'Could not reach the backend.'; $('modelDot').className = 'dot bad'; });
loadSessions();
</script>
