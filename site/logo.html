<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskWrite logo</title><link rel="icon" href="favicon.svg">
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f6f4ee; color: #14161b; }
  main { max-width: 920px; margin: 0 auto; padding: 36px 20px 60px; }
  h1 { font-size: 26px; margin: 0 0 24px; } .cap { font: 11px ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: #737987; margin: 26px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .box { border-radius: 16px; padding: 30px; display: flex; align-items: center; justify-content: center; gap: 20px; min-height: 150px; border: 1px solid #e2ded2; }
  .light { background: #fff; } .dark { background: #14161b; border-color: #14161b; } img { display: block; max-width: 100%; height: auto; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style></head><body><main>
<h1>TaskWrite logo</h1>
<div class="cap">Mark</div>
<div class="grid"><div class="box light"><img src="logo-mark.svg" width="120" height="120" alt="TaskWrite mark"></div>
<div class="box dark"><img src="logo-mark.svg" width="120" height="120" alt="TaskWrite mark"></div></div>
<div class="cap">With the name</div>
<div class="grid"><div class="box light"><img src="logo-wordmark.svg" width="280" alt="TaskWrite wordmark"></div>
<div class="box dark"><img src="logo-wordmark-dark.svg" width="280" alt="TaskWrite wordmark on dark"></div></div>
<div class="cap">Small sizes</div>
<div class="box light"><img src="logo-mark.svg" width="16" height="16" alt=""><img src="logo-mark.svg" width="24" height="24" alt=""><img src="logo-mark.svg" width="32" height="32" alt=""><img src="logo-mark.svg" width="48" height="48" alt=""></div>
</main></body></html>
